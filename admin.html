<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | AI Virtual Receptionist</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font:15px system-ui,Arial,sans-serif}.wrap{max-width:1100px;margin:42px auto;padding:0 18px}.panel{background:white;border:1px solid #e3e9f2;border-radius:14px;padding:24px;box-shadow:0 8px 30px #1720330a}.login{max-width:420px;margin:10vh auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{margin:0;color:#101d35}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #d5deea;border-radius:8px}input{width:100%;margin:10px 0}button{background:#2563eb;color:white;border:0;font-weight:700;cursor:pointer}button.secondary{background:#eaf0fb;color:#1d3763}.hidden{display:none}.muted{color:#64748b}.error{color:#b91c1c}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#f6f8fc;padding:14px 18px;border-radius:10px;min-width:130px}.stat b{display:block;font-size:24px}.lead{border-top:1px solid #e7edf5;padding:18px 0;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}.lead:first-child{border-top:0}.lead h3{margin:0 0 5px}.lead p{margin:4px 0;overflow-wrap:anywhere}.lead select{width:100%}.notes{width:100%;min-height:65px;margin:8px 0}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.small{font-size:12px}@media(max-width:720px){.lead{grid-template-columns:1fr}.wrap{margin:20px auto}.panel{padding:18px}}
</style></head><body><main class="wrap">
<section id="login" class="panel login"><h1>Admin sign in</h1><p class="muted">Private business lead dashboard.</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="Admin password" required><button type="submit">Sign in</button><p id="loginError" class="error"></p></form></section>
<section id="dashboard" class="hidden"><div class="panel"><div class="top"><div><h1>Incoming demo requests</h1><p class="muted">Review leads, track progress, and keep private notes.</p></div><div class="actions"><button class="secondary" id="refresh">Refresh</button><button id="logout">Sign out</button></div></div><div class="stats"><div class="stat"><b id="total">0</b><span class="muted">Total requests</span></div><div class="stat"><b id="new">0</b><span class="muted">New</span></div><div class="stat"><b id="active">0</b><span class="muted">Active</span></div></div><div id="list" class="panel" style="padding:8px 20px"></div><p id="message" class="muted small"></p></div></section>
</main><script>
const $=id=>document.getElementById(id);
const statuses=[["new","New"],["contacted","Contacted"],["demo_scheduled","Demo scheduled"],["demo_sent","Demo sent"],["approved","Approved"],["active","Active"],["closed","Closed"]];
async function api(url,options={}){const r=await fetch(url,{credentials:"same-origin",headers:{"Content-Type":"application/json",...(options.headers||{})},...options});if(!r.ok){let m="Request failed";try{m=(await r.json()).error||m}catch{}throw new Error(m)}return r.json()}
function showDashboard(){ $("login").classList.add("hidden");$("dashboard").classList.remove("hidden");loadLeads()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function check(){try{await api("/api/admin/me");showDashboard()}catch{$("login").classList.remove("hidden")}}
async function loadLeads(){try{const data=await api("/api/admin/leads");const leads=data.leads;$("total").textContent=leads.length;$("new").textContent=leads.filter(x=>x.status==="new").length;$("active").textContent=leads.filter(x=>x.status==="active").length;if(!leads.length){$("list").innerHTML='<p class="muted">No demo requests yet. New submissions will appear here.</p>';return}
$("list").innerHTML=leads.map(l=>'<article class="lead"><div><h3>'+esc(l.business_name)+'</h3><p>'+esc(l.contact_name)+' · '+esc(l.business_type)+'</p><p><a href="mailto:'+esc(l.email)+'">'+esc(l.email)+'</a></p><p>'+esc(l.phone)+'</p><p class="muted small">'+new Date(l.created_at).toLocaleString()+'</p></div><div><b>What they need</b><p>'+esc(l.needs||"No details provided")+'</p><p class="muted small">Estimated calls: '+esc(l.monthly_call_volume||"Not provided")+'</p></div><div><label>Status</label><select data-status="'+l.id+'">'+statuses.map(([v,n])=>'<option value="'+v+'" '+(l.status===v?'selected':'')+'>'+n+'</option>').join("")+'</select><textarea class="notes" data-notes="'+l.id+'" placeholder="Private internal notes">'+esc(l.internal_notes||"")+'</textarea><button data-save="'+l.id+'">Save changes</button></div></article>').join("");
$("list").querySelectorAll("[data-save]").forEach(b=>b.addEventListener("click",async()=>{const id=b.dataset.save;try{await api("/api/admin/leads/"+id,{method:"PATCH",body:JSON.stringify({status:$("list").querySelector('[data-status="'+id+'"]').value,internal_notes:$("list").querySelector('[data-notes="'+id+'"]').value})});$("message").textContent="Lead updated.";loadLeads()}catch(e){$("message").textContent=e.message}}));
}catch(e){$("message").textContent=e.message;if(e.message.includes("sign in")){$("dashboard").classList.add("hidden");$("login").classList.remove("hidden")}}}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginError").textContent="";try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("password").value})});$("password").value="";showDashboard()}catch(e){$("loginError").textContent=e.message}});
$("refresh").addEventListener("click",loadLeads);$("logout").addEventListener("click",async()=>{await api("/api/admin/logout",{method:"POST",body:"{}"});$("dashboard").classList.add("hidden");$("login").classList.remove("hidden")});
check();
</script></body></html>
